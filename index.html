<!-- ===== Firebase Configuration ===== -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-analytics.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyLMPmFvc1emOPi0VutMjLKmKAxQKu1IQ",
    authDomain: "flneltarf-c81ed.firebaseapp.com",
    projectId: "flneltarf-c81ed",
    storageBucket: "flneltarf-c81ed.firebasestorage.app",
    messagingSenderId: "191415829722",
    appId: "1:191415829722:web:0362f7685143cac8c151e3",
    measurementId: "G-RDRFJD29HM"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const db = getFirestore(app);

  // ======================
  // Load dynamic posts from Firestore
  // ======================
  async function loadPosts() {
    const postsContainer = document.getElementById("dynamicPosts");
    if (!postsContainer) return;

    const querySnapshot = await getDocs(collection(db, "posts"));
    querySnapshot.forEach((doc) => {
      const data = doc.data();
      postsContainer.innerHTML += `
        <section class="slide px-6">
          <div class="flex flex-col md:flex-row items-start gap-8">
            <img src="${data.image}" class="w-full md:w-1/2 rounded-lg shadow">
            <div class="md:w-1/2">
              <h2 class="text-3xl font-bold mb-4">${data.title}</h2>
              <p class="leading-relaxed text-lg text-justify">${data.content}</p>
            </div>
          </div>
        </section>
      `;
    });
  }

  loadPosts();
</script>
